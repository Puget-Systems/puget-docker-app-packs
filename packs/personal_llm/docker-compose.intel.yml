# Intel Arc Personal LLM — runs llama.cpp (llama-server, SYCL build), NOT Ollama.
# Same engine swap as the AMD override (image + entrypoint + command + port, UI/brain
# repointed to the OpenAI API on :8000); only the image and device passthrough differ.
# Measured 2026-10-07 on 2x Arc Pro B70: Qwen3.8-27B Q4_K_M 27.8 tok/s here vs 17.1 on
# Ollama's Vulkan backend, Qwen3.6-35B-A3B 103 vs 52 (see llama_menu_amd.sh).
# MODEL_ID / MAX_CONTEXT / LLAMA_PARALLEL / LLAMA_SPLIT_MODE / LLAMA_IMAGE come from .env.
services:
  inference:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-intel-b11459}
    entrypoint: ["/app/llama-server"]
    command:
      - "-hf"
      - "${MODEL_ID:-unsloth/Qwen3.6-35B-A3B-GGUF:Q4_K_M}"
      - "-ngl"
      - "999"
      # Layer split across cards (none on one GPU); see llama_menu_amd.sh for the numbers.
      - "--split-mode"
      - "${LLAMA_SPLIT_MODE:-layer}"
      - "-fa"
      - "on"
      # -c is split evenly across --parallel slots (per-request ctx = MAX_CONTEXT / slots).
      - "--parallel"
      - "${LLAMA_PARALLEL:-2}"
      - "-c"
      - "${MAX_CONTEXT:-32768}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--jinja"
    ports:
      - "8000:8000"
    # The image's default healthcheck probes :8080; llama-server is on :8000.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1800s
    environment:
      # llama.cpp's -hf downloader 404s through the Olah mirror, so GGUF comes from
      # HuggingFace directly (same as AMD).
      - HF_ENDPOINT=https://huggingface.co
      - LLAMA_CACHE=/root/.cache/huggingface
    volumes:
      - ollama_data:/root/.cache/huggingface
    devices:
      - /dev/dri:/dev/dri

  # Repoint Open WebUI from the Ollama API to llama-server's OpenAI-compatible API.
  ui:
    environment:
      - OPENAI_API_BASE_URL=http://inference:8000/v1
      - OPENAI_API_KEY=not-needed
      - ENABLE_OLLAMA_API=false
      - OLLAMA_BASE_URL=
      - WEBUI_AUTH=false

  brain:
    environment:
      - OLLAMA_HOST=http://inference:8000
