services:
  # 1. Inference Engine (vLLM)
  inference:
    # GPU-agnostic BASE. GPU access is added by a per-vendor override that install.sh
    # layers on: docker compose -f docker-compose.yml -f docker-compose.<vendor>.yml
    #   nvidia → deploy.resources (nvidia runtime)   amd → /dev/kfd+/dev/dri   intel → /dev/dri
    #
    # The vLLM image is PULLED, not built — NVIDIA: vllm/vllm-openai, AMD: rocm/vllm,
    # Intel: puget-vllm-xpu (built by install.sh under a DISTINCT tag) — selected via
    # VLLM_IMAGE in .env. Do NOT add a `build:` block here: docker compose tags a build's
    # output with the service's `image:` name, so `smart_build`/`docker compose build`
    # would CLOBBER the pulled image (e.g. a CUDA Dockerfile overwriting the ROCm image →
    # "Failed to infer device type"). Build any derived image under its own tag and point
    # VLLM_IMAGE at it.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.20.2}
    container_name: puget_vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Optional: route model downloads through a Squid cache proxy (auto-detected by
      # install.sh on the Puget LAN; empty otherwise).
      - HTTPS_PROXY=${CACHE_PROXY:-}
      - HTTP_PROXY=${CACHE_PROXY:-}
      # NO_PROXY is written by install.sh (it appends the HF-mirror host so weights
      # stream straight from the mirror, not through the proxy).
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,0.0.0.0}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,0.0.0.0}
      - HF_HOME=/root/.cache/huggingface
      # HF mirror (Olah): set HF_ENDPOINT in .env to pull weights from a local mirror.
      # Defaults to the real hub — must NOT be empty (an empty endpoint breaks downloads).
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
      # HF token (optional, read-only recommended): a token makes the mirror's per-request
      # repo-visibility HEAD to HF authenticated, dodging HF's aggressive rate-limit on
      # ANONYMOUS metadata calls (the intermittent 401/"repo not found" via Olah). Empty =
      # anonymous (fine for fully-cached models, or when the mirror runs offline=true).
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ipc: host
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        exec python3 -m vllm.entrypoints.openai.api_server
        --model=${MODEL_ID:-Qwen/Qwen3-8B}
        --tensor-parallel-size=${GPU_COUNT:-1}
        ${MAX_CONTEXT:+--max-model-len=${MAX_CONTEXT}}
        --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.90}
        --max-num-seqs=32
        --dtype=${DTYPE:-auto}
        --trust-remote-code
        --disable-custom-all-reduce
        ${REASONING_ARGS:-}
        ${THINKING_ARGS:-}
        ${TOOL_CALL_ARGS:-}
        ${EXTRA_VLLM_ARGS:-}

  # 2. User Interface (Open WebUI)
  ui:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: puget_team_webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Connect to vLLM as an OpenAI-compatible backend
      - OPENAI_API_BASE_URL=http://inference:8000/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_AUTH=false
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - inference

  # 3. Swarm Brain (Optional/Advanced)
  brain:
    build:
      context: brain
      dockerfile: Dockerfile
    container_name: puget_team_brain
    restart: unless-stopped
    volumes:
      - ./src:/home/puget-app-pack/app
    depends_on:
      - inference
    environment:
      - OPENAI_API_BASE=http://inference:8000/v1
      - OPENAI_API_KEY=not-needed
    command: ["tail", "-f", "/dev/null"]

volumes:
  vllm_cache:
  open_webui_data:
