services:
  # 1. Inference Engine (vLLM)
  inference:
    # The vLLM image is PULLED, not built — NVIDIA: vllm/vllm-openai, AMD: rocm/vllm,
    # Intel: intel/llm-scaler-vllm — selected via VLLM_IMAGE in .env.
    # IMPORTANT: do NOT add a `build:` block to this service. docker compose tags a
    # build's output with the service's `image:` name, so `smart_build`/`docker compose
    # build` would rebuild and CLOBBER the pulled image — e.g. the old Dockerfile.gemma4
    # (FROM a CUDA vllm/vllm-openai base) overwrote the ROCm rocm/vllm image, leaving a
    # CUDA torch that can't see the AMD GPU ("Failed to infer device type"). Build any
    # derived image (e.g. Gemma 4) under a DISTINCT tag and point VLLM_IMAGE at it.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: puget_vllm
    restart: unless-stopped

    ports:
      - "8000:8000"
    environment:
      # Optional: Route model downloads through Squid cache proxy
      - HTTPS_PROXY=${CACHE_PROXY:-}
      - HTTP_PROXY=${CACHE_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,0.0.0.0
      - no_proxy=localhost,127.0.0.1,0.0.0.0
      - HF_HOME=/root/.cache/huggingface
      # HF mirror (Olah): set HF_ENDPOINT in .env to pull weights from a local mirror.
      # Defaults to the real hub — must NOT be empty (an empty endpoint breaks downloads).
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
      # AMD/PCIe: disable peer-to-peer so the RCCL all-reduce path doesn't hang.
      - NCCL_P2P_DISABLE=1
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ipc: host
    # AMD ROCm device passthrough. NVIDIA uses the default nvidia container runtime
    # (configured by install.sh) and ignores these; AMD has no default runtime, so the
    # ROCm vLLM image needs the kfd + render nodes explicitly or it can't see the GPU
    # ("Failed to infer device type"). group_add gives the container access to them.
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        exec python3 -m vllm.entrypoints.openai.api_server
        --model=${MODEL_ID:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}
        --tensor-parallel-size=${GPU_COUNT:-1}
        ${MAX_CONTEXT:+--max-model-len=${MAX_CONTEXT}}
        --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.90}
        --max-num-seqs=32
        --dtype=${DTYPE:-auto}
        --trust-remote-code
        --disable-custom-all-reduce
        ${REASONING_ARGS:-}
        ${THINKING_ARGS:-}
        ${TOOL_CALL_ARGS:-}
        ${EXTRA_VLLM_ARGS:-}

  # 2. User Interface (Open WebUI)
  ui:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: puget_team_webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Connect to vLLM as an OpenAI-compatible backend
      - OPENAI_API_BASE_URL=http://inference:8000/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_AUTH=false
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - inference

  # 3. Swarm Brain (Optional/Advanced)
  brain:
    build:
      context: brain
      dockerfile: Dockerfile
    container_name: puget_team_brain
    restart: unless-stopped
    volumes:
      - ./src:/home/puget-app-pack/app
    depends_on:
      - inference
    environment:
      - OPENAI_API_BASE=http://inference:8000/v1
      - OPENAI_API_KEY=not-needed
    command: ["tail", "-f", "/dev/null"]

volumes:
  vllm_cache:
  open_webui_data:
