services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.xpu
    container_name: puget_comfy_ui
    restart: unless-stopped
    
    # Enable Intel GPU
    devices:
      - /dev/dri:/dev/dri

    # Shared memory for PyTorch (large model loading)
    ipc: host

    # Increase limits for PyTorch
    ulimits:
      memlock: -1
      stack: 67108864

    # Standard Ports
    ports:
      - "8188:8188"

    # Volume Mounts for Persistence
    volumes:
      # Mount models from host (avoid downloading 10GB+ every rebuild)
      - ./models:/home/puget-app-pack/app/models
      
      # Mount outputs for easy access
      - ./output:/home/puget-app-pack/app/output
      
      # Mount input for workflows
      - ./input:/home/puget-app-pack/app/input
      
      # Persistence for Custom Nodes (Manager, etc.)
      - ./custom_nodes:/home/puget-app-pack/app/custom_nodes
      
      # Custom workflows (Puget templates, e.g. Branded Product Shot)
      - ./workflows:/home/puget-app-pack/app/user/default/workflows
      
      # ControlNet models (XLabs-AI)
      - ./models/xlabs/controlnets:/home/puget-app-pack/app/models/xlabs/controlnets

    environment:
      - CLI_ARGS=--listen 0.0.0.0 --preview-method auto
      - ONEAPI_DEVICE_SELECTOR=level_zero:gpu
      - SYCL_DEVICE_FILTER=level_zero:gpu
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMAND_LISTS=0
      - ZES_ENABLE_SYSMAN=0
      - NEO_ReadDeviceBinaryBuiltins=0
